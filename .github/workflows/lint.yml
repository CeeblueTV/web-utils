name: Lint
on:
    push:
        branches:
            - main
            - dev
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
permissions:
    contents: read
    pull-requests: read
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - uses: wagoid/commitlint-github-action@v5
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  cache: npm
                  node-version: 24
            - run: npm ci
            - run: npm run lint
