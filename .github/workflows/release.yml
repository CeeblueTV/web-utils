name: Release
on:
    workflow_run:
        workflows: [lint]
        types: [completed]
        branches: [main]
    workflow_dispatch:
        branches: [main]
permissions:
    contents: read # for checkout
jobs:
    release:
        permissions:
            contents: write # to be able to publish a github release
            issues: write # to be able to comment on released issues
            pull-requests: write # to be able to comment on released pull requests
            id-token: write # to enable use of OIDC for npm trusted publishing
        name: release
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
        steps:
            - name: generate token
              id: generate_token
              uses: tibdex/github-app-token@v1
              with:
                  app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
                  private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  token: ${{ steps.generate_token.outputs.token }}
            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'
            - run: npm ci --prefer-offline --no-audit
            - run: npx semantic-release
              env:
                  GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
                  GIT_AUTHOR_NAME: ${{ vars.RELEASE_BOT_GIT_AUTHOR_NAME }}
                  GIT_AUTHOR_EMAIL: ${{ vars.RELEASE_BOT_GIT_AUTHOR_EMAIL }}
                  GIT_COMMITTER_NAME: ${{ vars.RELEASE_BOT_GIT_COMMITTER_NAME }}
                  GIT_COMMITTER_EMAIL: ${{ vars.RELEASE_BOT_GIT_COMMITTER_EMAIL }}
